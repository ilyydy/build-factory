# Johnshall / Shadowrocket-ADBlock-Rules-Forever: https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/lazy.conf
# Routing rules adapted for Mihomo by build-factory (CC BY-SA 4.0: https://creativecommons.org/licenses/by-sa/4.0/)
mode: rule
proxy-providers: {}
profile:
  store-selected: true

proxy-groups:
  - name: "节点选择"
    type: "select"
    include-all: true
    empty-fallback: "REJECT"
  - name: "新加坡"
    type: "url-test"
    include-all: true
    filter: "(?i)(新加坡|Singapore|\\bSG\\b|🇸🇬)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "香港"
    type: "url-test"
    include-all: true
    filter: "(?i)(香港|Hong[ -]?Kong|\\bHK\\b|🇭🇰)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "美国"
    type: "url-test"
    include-all: true
    filter: "(?i)(美国|美國|United States|\\bUSA\\b|America|\\bUS\\b|🇺🇸)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "日本"
    type: "url-test"
    include-all: true
    filter: "(?i)(日本|Japan|\\bJP\\b|🇯🇵)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "台湾"
    type: "url-test"
    include-all: true
    filter: "(?i)(台湾|台灣|Taiwan|\\bTW\\b|🇹🇼)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "泰国"
    type: "url-test"
    include-all: true
    filter: "(?i)(泰国|泰國|Thailand|\\bTH\\b|🇹🇭)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "韩国"
    type: "url-test"
    include-all: true
    filter: "(?i)(韩国|韓國|South Korea|Korea|\\bKR\\b|🇰🇷)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "菲律宾"
    type: "url-test"
    include-all: true
    filter: "(?i)(菲律宾|菲律賓|Philippines|\\bPH\\b|🇵🇭)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "德国"
    type: "url-test"
    include-all: true
    filter: "(?i)(德国|德國|Germany|\\bDE\\b|🇩🇪)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "OpenAI"
    type: "select"
    proxies: ["节点选择","新加坡","台湾","日本","韩国","美国"]
  - name: "TikTok"
    type: "select"
    proxies: ["节点选择","新加坡","台湾","日本","韩国","美国"]
  - name: "Gemini"
    type: "select"
    proxies: ["节点选择","新加坡","台湾","日本","韩国","美国"]
  - name: "Anthropic"
    type: "select"
    proxies: ["节点选择","新加坡","台湾","日本","韩国","美国"]

