# Johnshall / Shadowrocket-ADBlock-Rules-Forever: https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/sr_top500_whitelist_ad.conf
# Routing rules adapted for Mihomo by build-factory (CC BY-SA 4.0: https://creativecommons.org/licenses/by-sa/4.0/)
mode: rule
proxy-providers: {}
profile:
  store-selected: true

proxy-groups:
  - name: "节点选择"
    type: "select"
    include-all: true
    empty-fallback: "REJECT"
  - name: "新加坡"
    type: "url-test"
    include-all: true
    filter: "(?i)(新加坡|Singapore|\\bSG\\b|🇸🇬)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "香港"
    type: "url-test"
    include-all: true
    filter: "(?i)(香港|Hong[ -]?Kong|\\bHK\\b|🇭🇰)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "美国"
    type: "url-test"
    include-all: true
    filter: "(?i)(美国|美國|United States|\\bUSA\\b|America|\\bUS\\b|🇺🇸)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "日本"
    type: "url-test"
    include-all: true
    filter: "(?i)(日本|Japan|\\bJP\\b|🇯🇵)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "台湾"
    type: "url-test"
    include-all: true
    filter: "(?i)(台湾|台灣|Taiwan|\\bTW\\b|🇹🇼)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "泰国"
    type: "url-test"
    include-all: true
    filter: "(?i)(泰国|泰國|Thailand|\\bTH\\b|🇹🇭)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "韩国"
    type: "url-test"
    include-all: true
    filter: "(?i)(韩国|韓國|South Korea|Korea|\\bKR\\b|🇰🇷)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "菲律宾"
    type: "url-test"
    include-all: true
    filter: "(?i)(菲律宾|菲律賓|Philippines|\\bPH\\b|🇵🇭)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "德国"
    type: "url-test"
    include-all: true
    filter: "(?i)(德国|德國|Germany|\\bDE\\b|🇩🇪)"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 10
    timeout: 5000
    empty-fallback: "REJECT"
  - name: "OpenAI"
    type: "select"
    proxies: ["新加坡","台湾","日本","韩国","美国","节点选择"]
  - name: "TikTok"
    type: "select"
    proxies: ["新加坡","台湾","日本","韩国","美国","节点选择"]
  - name: "Gemini"
    type: "select"
    proxies: ["新加坡","台湾","日本","韩国","美国","节点选择"]
  - name: "Anthropic"
    type: "select"
    proxies: ["新加坡","台湾","日本","韩国","美国","节点选择"]

rule-providers:
  blackmatrix-openai-openai:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.yaml"
    proxy: DIRECT
    interval: 86400
  blackmatrix-tiktok-tiktok:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.yaml"
    proxy: DIRECT
    interval: 86400
  blackmatrix-gemini-gemini:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.yaml"
    proxy: DIRECT
    interval: 86400
  blackmatrix-anthropic-anthropic:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Anthropic/Anthropic.yaml"
    proxy: DIRECT
    interval: 86400
  my_white_ad-reject-1-domain:
    type: http
    behavior: domain
    format: text
    url: "https://raw.githubusercontent.com/ilyydy/build-factory/release/clash-rules/my_white_ad-reject-1-domain.txt"
    proxy: DIRECT
    interval: 86400
  my_white_ad-reject-1-classical:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/ilyydy/build-factory/release/clash-rules/my_white_ad-reject-1-classical.txt"
    proxy: DIRECT
    interval: 86400
  my_white_ad-direct-1-domain:
    type: http
    behavior: domain
    format: text
    url: "https://raw.githubusercontent.com/ilyydy/build-factory/release/clash-rules/my_white_ad-direct-1-domain.txt"
    proxy: DIRECT
    interval: 86400
  my_white_ad-proxy-1-domain:
    type: http
    behavior: domain
    format: text
    url: "https://raw.githubusercontent.com/ilyydy/build-factory/release/clash-rules/my_white_ad-proxy-1-domain.txt"
    proxy: DIRECT
    interval: 86400
  my_white_ad-proxy-1-classical:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/ilyydy/build-factory/release/clash-rules/my_white_ad-proxy-1-classical.txt"
    proxy: DIRECT
    interval: 86400
  my_white_ad-direct-2-domain:
    type: http
    behavior: domain
    format: text
    url: "https://raw.githubusercontent.com/ilyydy/build-factory/release/clash-rules/my_white_ad-direct-2-domain.txt"
    proxy: DIRECT
    interval: 86400
  my_white_ad-direct-3-classical:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/ilyydy/build-factory/release/clash-rules/my_white_ad-direct-3-classical.txt"
    proxy: DIRECT
    interval: 86400
  blackmatrix-applenews-applenews:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AppleNews/AppleNews.yaml"
    proxy: DIRECT
    interval: 86400

rules:
  - "DOMAIN-SUFFIX,cityline.com,节点选择"
  - "RULE-SET,blackmatrix-openai-openai,OpenAI"
  - "RULE-SET,blackmatrix-tiktok-tiktok,TikTok"
  - "RULE-SET,blackmatrix-gemini-gemini,Gemini"
  - "RULE-SET,blackmatrix-anthropic-anthropic,Anthropic"
  - "RULE-SET,my_white_ad-reject-1-domain,REJECT"
  - "RULE-SET,my_white_ad-reject-1-classical,REJECT"
  - "RULE-SET,my_white_ad-direct-1-domain,DIRECT"
  - "RULE-SET,my_white_ad-proxy-1-domain,节点选择"
  - "RULE-SET,my_white_ad-proxy-1-classical,节点选择"
  - "RULE-SET,my_white_ad-direct-2-domain,DIRECT"
  - "GEOIP,CN,DIRECT"
  - "RULE-SET,my_white_ad-direct-3-classical,DIRECT"
  - "RULE-SET,blackmatrix-applenews-applenews,节点选择"
  - "MATCH,节点选择"
